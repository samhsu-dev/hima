[project]
name = "hima-dht-advisor"
version = "0.1.0"
description = "Advisor inference service: the fine-tuned suggestion trio behind HTTP"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "pydantic==2.13.4",
    "transformers==5.14.1",
    "torch==2.13.0",
    "accelerate==1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
