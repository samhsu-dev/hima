<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HIMA Replay Player</title>
<style>
  :root {
    --heritage: #002d72; --spirit: #68ace5; --green: #008767; --red: #a6192e;
    --sand: #8a6a2f; --paper: #ffffff; --ink: #1c1a17; --ink-quiet: #5d5750;
    --rule: #c9c5be; --rule-faint: #e6e3dd; --wash: #f5f3ef;
    --own: #002d72; --enemy: #a6192e; --mineral: #68ace5; --gas: #008767;
    --map-bg: #f5f3ef;
    --serif: "Source Serif 4", Charter, Georgia, serif;
    --sans: "Work Sans", "Helvetica Neue", system-ui, sans-serif;
    --mono: ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --heritage: #9dc4ee; --green: #5cb99f; --red: #e08b7c; --sand: #cba052;
      --paper: #14161a; --ink: #e4e1db; --ink-quiet: #a49e95;
      --rule: #3b3f47; --rule-faint: #262a30; --wash: #1b1e23;
      --own: #68ace5; --enemy: #e08b7c; --gas: #5cb99f; --map-bg: #1b1e23;
    }
  }
  :root[data-theme="dark"] {
    --heritage: #9dc4ee; --green: #5cb99f; --red: #e08b7c; --sand: #cba052;
    --paper: #14161a; --ink: #e4e1db; --ink-quiet: #a49e95;
    --rule: #3b3f47; --rule-faint: #262a30; --wash: #1b1e23;
    --own: #68ace5; --enemy: #e08b7c; --gas: #5cb99f; --map-bg: #1b1e23;
  }
  :root[data-theme="light"] {
    --heritage: #002d72; --spirit: #68ace5; --green: #008767; --red: #a6192e;
    --sand: #8a6a2f; --paper: #ffffff; --ink: #1c1a17; --ink-quiet: #5d5750;
    --rule: #c9c5be; --rule-faint: #e6e3dd; --wash: #f5f3ef;
    --own: #002d72; --enemy: #a6192e; --mineral: #68ace5; --gas: #008767;
    --map-bg: #f5f3ef;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--paper); color: var(--ink);
    font: 16px/1.5 var(--sans);
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  header {
    border-top: 3px solid var(--heritage);
    padding: 10px 16px; border-bottom: 1px solid var(--rule);
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  header h1 { font-family: var(--serif); font-size: 18px; font-weight: 600; }
  .badge {
    font-size: 11px; font-weight: 600; letter-spacing: .09em;
    text-transform: uppercase;
  }
  .badge.Defeat { color: var(--red); }
  .badge.Victory { color: var(--green); }
  .badge.Tie { color: var(--ink-quiet); }
  .badge.live { color: var(--heritage); }
  header .muted { color: var(--ink-quiet); font-size: 13px; }
  .legend { font-size: 12px; color: var(--ink-quiet); white-space: nowrap; }
  .legend .sw {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    vertical-align: -1px; margin: 0 4px 0 10px;
  }
  .legend .sw:first-child { margin-left: 0; }
  .legend .sw.own { background: var(--own); }
  .legend .sw.enemy { background: var(--enemy); }
  .legend .sw.mineral { background: var(--mineral); border-radius: 2px; }
  .legend .sw.gas { background: var(--gas); border-radius: 2px; }
  main { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 10px; min-width: 0; }
  canvas { max-width: 100%; max-height: 100%; border: 1px solid var(--rule); }
  aside {
    width: 340px; border-left: 1px solid var(--rule); display: flex;
    flex-direction: column; min-height: 0;
  }
  aside h2 {
    font-size: 11px; color: var(--ink-quiet); font-weight: 600;
    letter-spacing: .12em; text-transform: uppercase;
    padding: 10px 12px 4px;
  }
  #decisions { flex: 1.2; overflow-y: auto; border-bottom: 1px solid var(--rule); }
  #commands { flex: 1; overflow-y: auto; }
  .decision {
    padding: 6px 12px; border-left: 3px solid transparent; cursor: pointer;
    font-size: 13px; color: var(--ink-quiet);
  }
  .decision:hover { background: var(--wash); }
  .decision.active { border-left-color: var(--sand); color: var(--ink); background: var(--wash); }
  .decision .head { font-weight: 600; color: var(--heritage); }
  .command { padding: 2px 12px; font-size: 13px; font-family: var(--mono); }
  .command .st-ok { color: var(--green); }
  .command .st-bad { color: var(--red); }
  footer {
    border-top: 1px solid var(--rule); padding: 10px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  button, select {
    background: var(--wash); color: var(--ink); border: 1px solid var(--rule);
    border-radius: 4px; padding: 4px 12px; font-size: 14px; font-family: var(--sans);
    cursor: pointer;
  }
  #timeline { flex: 1; position: relative; height: 28px; }
  #slider { width: 100%; position: absolute; top: 4px; accent-color: var(--heritage); }
  #ticks { position: absolute; left: 0; right: 0; top: 22px; height: 6px; pointer-events: none; }
  #ticks span { position: absolute; width: 2px; height: 6px; background: var(--sand); }
  #readout { font-size: 13px; color: var(--ink-quiet); white-space: nowrap; font-variant-numeric: tabular-nums; }
  #clock { font-size: 14px; font-variant-numeric: tabular-nums; min-width: 110px; text-align: center; }
  #tip {
    position: fixed; display: none; pointer-events: none; z-index: 10;
    font-size: 12px; font-family: var(--sans); color: var(--ink);
    background: var(--paper); border: 1px solid var(--rule); padding: 3px 8px;
  }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <span id="result" class="badge"></span>
  <span id="mapname" class="muted"></span>
  <span class="legend"><span class="sw own"></span>own <span class="sw enemy"></span>enemy <span class="sw mineral"></span>mineral <span class="sw gas"></span>gas</span>
  <span class="muted">Enemy units are visible only inside friendly vision (fog of war) · Space plays, arrows seek</span>
</header>
<main>
  <div id="stage"><canvas id="map"></canvas></div>
  <aside>
    <h2>LLM Decisions (click to jump)</h2>
    <div id="decisions"></div>
    <h2>Executed Commands</h2>
    <div id="commands"></div>
  </aside>
</main>
<footer>
  <button id="play">▶ Play</button>
  <select id="speed">
    <option value="1">1×</option>
    <option value="2">2×</option>
    <option value="4" selected>4×</option>
    <option value="8">8×</option>
    <option value="16">16×</option>
  </select>
  <span id="clock"></span>
  <div id="timeline">
    <input id="slider" type="range" min="0" step="0.1" value="0">
    <div id="ticks"></div>
  </div>
  <span id="readout"></span>
</footer>
<div id="tip"></div>
<script>
const HIMA = __HIMA_DATA_JSON__;

const [PX, PY, PW, PH] = HIMA.meta.playable;
let DURATION = HIMA.meta.duration;
const canvas = document.getElementById("map");
const ctx = canvas.getContext("2d");
const CSS_W = 780;
const SCALE = CSS_W / PW;
const CSS_H = Math.round(PH * SCALE);
const DPR = window.devicePixelRatio || 1;
canvas.width = CSS_W * DPR;
canvas.height = CSS_H * DPR;
canvas.style.width = CSS_W + "px";
canvas.style.height = CSS_H + "px";
ctx.scale(DPR, DPR);

const mx = x => (x - PX) * SCALE;
const my = y => (PH - (y - PY)) * SCALE;
const fmt = t => `${String(Math.floor(t / 60)).padStart(2, "0")}:${String(Math.floor(t % 60)).padStart(2, "0")}`;

function readColors() {
  const style = getComputedStyle(document.documentElement);
  const v = name => style.getPropertyValue(name).trim();
  return { bg: v("--map-bg"), own: v("--own"), enemy: v("--enemy"),
           mineral: v("--mineral"), gas: v("--gas"), track: v("--rule"),
           ok: v("--green"), bad: v("--red") };
}
let COLORS = readColors();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  COLORS = readColors();
  syncAll(true);
});

document.getElementById("title").textContent = HIMA.meta.replay;
document.getElementById("mapname").textContent = `${HIMA.meta.map} · ${fmt(DURATION)}`;
const resultEl = document.getElementById("result");
function setResult(label) {
  resultEl.textContent = label === "live" ? "LIVE" : label;
  resultEl.className = "badge " + label;
}
setResult(HIMA.live ? "live" : HIMA.meta.result);

const slider = document.getElementById("slider");
slider.max = DURATION;
const ticks = document.getElementById("ticks");
function rebuildTicks() {
  ticks.innerHTML = "";
  for (const d of HIMA.decisions) {
    const s = document.createElement("span");
    s.style.left = (d.t / DURATION * 100) + "%";
    ticks.appendChild(s);
  }
}
rebuildTicks();

const decisionsEl = document.getElementById("decisions");
function addDecisionEntry(d, i) {
  const div = document.createElement("div");
  div.className = "decision";
  div.id = "dec-" + i;
  div.innerHTML = `<span class="head">${fmt(d.t)} · ${d.n} actions</span><br>${escapeHtml(d.s)}`;
  div.onclick = () => { simT = d.t; syncAll(true); };
  decisionsEl.appendChild(div);
}
HIMA.decisions.forEach(addDecisionEntry);

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function frameIndexFor(t) {
  const f = HIMA.frames;
  let lo = 0, hi = f.length - 1;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (f[mid].t <= t) lo = mid; else hi = mid - 1;
  }
  return lo;
}

function drawFrame(frame) {
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, CSS_W, CSS_H);
  for (const [x, y, kind] of HIMA.neutral) {
    ctx.globalAlpha = 0.6;
    ctx.fillStyle = kind === "m" ? COLORS.mineral : COLORS.gas;
    ctx.fillRect(mx(x) - 2, my(y) - 2, 4, 4);
  }
  ctx.globalAlpha = 1;
  for (const [ti, x, y, owner, hp] of frame.u) {
    const meta = HIMA.type_meta[ti];
    const color = owner === 1 ? COLORS.own : COLORS.enemy;
    const r = Math.max(meta.r * SCALE, 1.6);
    ctx.fillStyle = color;
    if (meta.s) {
      ctx.globalAlpha = 0.9;
      ctx.fillRect(mx(x) - r, my(y) - r, r * 2, r * 2);
    } else {
      ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.arc(mx(x), my(y), r, 0, Math.PI * 2);
      ctx.fill();
    }
    if (hp < 0.99) {
      const w = Math.max(r * 2, 8);
      ctx.fillStyle = COLORS.track;
      ctx.fillRect(mx(x) - w / 2, my(y) - r - 5, w, 2.5);
      ctx.fillStyle = hp > 0.5 ? COLORS.ok : COLORS.bad;
      ctx.fillRect(mx(x) - w / 2, my(y) - r - 5, w * hp, 2.5);
    }
    ctx.globalAlpha = 1;
  }
}

function updatePanels(frame) {
  let own = 0, enemy = 0;
  for (const u of frame.u) (u[3] === 1 ? own++ : enemy++);
  document.getElementById("readout").textContent =
    `Minerals ${frame.m} · Gas ${frame.g} · Supply ${frame.su}/${frame.sc} · Own ${own} · Enemy visible ${enemy}`;
  let active = -1;
  HIMA.decisions.forEach((d, i) => { if (d.t <= simT) active = i; });
  document.querySelectorAll(".decision").forEach((el, i) => el.classList.toggle("active", i === active));
  if (active >= 0 && playing) {
    document.getElementById("dec-" + active).scrollIntoView({ block: "nearest" });
  }
  const visible = HIMA.commands.filter(c => c.t <= simT).slice(-14);
  document.getElementById("commands").innerHTML = visible.map(c => {
    const bad = c.st !== "ok";
    return `<div class="command">${fmt(c.t)} &lt;${c.a}&gt; ` +
      `<span class="${bad ? "st-bad" : "st-ok"}">${bad ? c.st : "✓"}</span></div>`;
  }).join("");
  document.getElementById("commands").scrollTop = 1e9;
}

let simT = 0, playing = false, lastTs = null, lastIdx = -1;

function syncAll(force) {
  if (!HIMA.frames.length) return;
  const idx = frameIndexFor(simT);
  if (idx !== lastIdx || force) {
    drawFrame(HIMA.frames[idx]);
    updatePanels(HIMA.frames[idx]);
    lastIdx = idx;
  }
  slider.value = simT;
  document.getElementById("clock").textContent = `${fmt(simT)} / ${fmt(DURATION)}`;
}

function tick(ts) {
  if (lastTs !== null && playing) {
    simT = Math.min(simT + (ts - lastTs) / 1000 * Number(speedEl.value), DURATION);
    if (simT >= DURATION) setPlaying(false);
    syncAll(false);
  }
  lastTs = ts;
  requestAnimationFrame(tick);
}

const playBtn = document.getElementById("play");
const speedEl = document.getElementById("speed");
function setPlaying(value) {
  playing = value;
  playBtn.textContent = playing ? "⏸ Pause" : "▶ Play";
}
playBtn.onclick = () => {
  if (!playing && simT >= DURATION) simT = 0;
  setPlaying(!playing);
};
slider.oninput = () => { simT = Number(slider.value); syncAll(true); };

const SEEK_STEP_S = 5;

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if (e.code === "Space") {
    e.preventDefault();
    playBtn.click();
  } else if (e.code === "ArrowLeft") {
    simT = Math.max(0, simT - SEEK_STEP_S);
    syncAll(true);
  } else if (e.code === "ArrowRight") {
    simT = Math.min(DURATION, simT + SEEK_STEP_S);
    syncAll(true);
  }
});

const tip = document.getElementById("tip");
const HOVER_SLACK_PX = 4;

canvas.addEventListener("mousemove", e => {
  const frame = HIMA.frames[lastIdx];
  if (!frame) { tip.style.display = "none"; return; }
  const rect = canvas.getBoundingClientRect();
  const toCanvas = CSS_W / rect.width;
  const cx = (e.clientX - rect.left) * toCanvas;
  const cy = (e.clientY - rect.top) * toCanvas;
  let best = null, bestDist = Infinity;
  for (const [ti, x, y, owner, hp] of frame.u) {
    const dist = Math.hypot(mx(x) - cx, my(y) - cy);
    const reach = Math.max(HIMA.type_meta[ti].r * SCALE, 1.6) + HOVER_SLACK_PX;
    if (dist <= reach && dist < bestDist) { bestDist = dist; best = [ti, owner, hp]; }
  }
  if (!best) { tip.style.display = "none"; return; }
  const side = best[1] === 1 ? "own" : "enemy";
  tip.textContent = `${HIMA.types[best[0]]} · ${side} · ${Math.round(best[2] * 100)}% HP`;
  tip.style.left = (e.clientX + 12) + "px";
  tip.style.top = (e.clientY + 12) + "px";
  tip.style.display = "block";
});
canvas.addEventListener("mouseleave", () => { tip.style.display = "none"; });

const FOLLOW_SLACK = 3;

function appendFrame(frame) {
  const follow = simT >= DURATION - FOLLOW_SLACK;
  HIMA.frames.push(frame);
  DURATION = Math.max(DURATION, frame.t);
  HIMA.meta.duration = DURATION;
  slider.max = DURATION;
  document.getElementById("mapname").textContent = `${HIMA.meta.map} · ${fmt(DURATION)}`;
  rebuildTicks();
  if (follow) simT = DURATION;
  syncAll(true);
}

function connectLive() {
  const query = `records=${HIMA.stream.records}` +
    `&decisions=${HIMA.decisions.length}&commands=${HIMA.commands.length}`;
  const source = new EventSource("/api/live/stream?" + query);
  source.addEventListener("type", e => {
    const r = JSON.parse(e.data);
    HIMA.types.push(r.name);
    HIMA.type_meta.push({ r: r.r, s: r.s });
  });
  source.addEventListener("frame", e => {
    const r = JSON.parse(e.data);
    appendFrame({ t: r.t, m: r.m, g: r.g, su: r.su, sc: r.sc, u: r.u });
  });
  source.addEventListener("decision", e => {
    const d = JSON.parse(e.data);
    HIMA.decisions.push(d);
    addDecisionEntry(d, HIMA.decisions.length - 1);
    rebuildTicks();
  });
  source.addEventListener("command", e => HIMA.commands.push(JSON.parse(e.data)));
  source.addEventListener("end", e => {
    HIMA.meta.result = JSON.parse(e.data).result;
    HIMA.live = false;
    setResult(HIMA.meta.result);
    source.close();
  });
}

if (HIMA.live) {
  simT = DURATION;
  connectLive();
}

syncAll(true);
requestAnimationFrame(tick);
</script>
</body>
</html>
