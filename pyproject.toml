[tool.uv.workspace]
members = ["packages/*"]

[tool.uv]
override-dependencies = [
    # pysc2 declares the abandoned official s2clientprotocol, whose stale
    # protoc codegen clobbers the regenerated pys2clientprotocol package that
    # burnysc2 requires; both install into the same s2clientprotocol/ directory.
    "s2clientprotocol; sys_platform == 'never'",
]

[tool.uv.sources]
# Linux images run the advisor on CPU; macOS keeps the PyPI MPS wheel.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = ["--import-mode=importlib"]
