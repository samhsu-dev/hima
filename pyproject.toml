[project]
name = "hima-dht"
version = "0.1.0"
description = "HIMA (Society of Mind Meets Real-Time Strategy) local reproduction toolkit"
requires-python = ">=3.12"
dependencies = [
    "burnysc2==7.3.0",
    "pys2clientprotocol==1.0.2",
    "pysc2==4.0.0",
    "s2protocol==5.0.16.97563.0",
    "mpyq==0.2.5",
    "numpy==2.5.1",
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "pydantic==2.13.4",
    "transformers==5.14.1",
    "torch==2.13.0",
    "accelerate==1.14.0",
    "openai==2.53.0",
    "requests==2.34.2",
    "pygame==2.6.1",
    "psutil==7.2.2",
    "python-dotenv==1.2.2",
    "hima-dht-records",
    "hima-dht-game",
]

[project.scripts]
hima = "hima_dht.cli:main"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv]
override-dependencies = [
    # pysc2 declares the abandoned official s2clientprotocol, whose stale
    # protoc codegen clobbers the regenerated pys2clientprotocol package that
    # burnysc2 requires; both install into the same s2clientprotocol/ directory.
    "s2clientprotocol; sys_platform == 'never'",
]

[tool.uv.sources]
hima-dht-records = { workspace = true }
hima-dht-game = { workspace = true }
# Linux images run the advisor on CPU; macOS keeps the PyPI MPS wheel.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hima_dht"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
