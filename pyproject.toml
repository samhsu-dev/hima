[tool.uv.workspace]
members = ["packages/*"]

[tool.uv]
# Plain `uv sync` on the dev machine installs the native-advisor stack too;
# image builds prune it with `--package`/`--no-default-groups`.
default-groups = ["dev", "advisor"]
override-dependencies = [
    # pysc2 declares the abandoned official s2clientprotocol, whose stale
    # protoc codegen clobbers the regenerated pys2clientprotocol package that
    # burnysc2 requires; both install into the same s2clientprotocol/ directory.
    "s2clientprotocol; sys_platform == 'never'",
]

[tool.uv.sources]
hima-dht-game = { workspace = true }
# Linux images run the advisor on CPU; macOS keeps the PyPI MPS wheel.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.14.14",
    "mypy>=1.19.0",
    "types-requests>=2.32",
    "types-psutil>=7.0",
]
advisor = [
    "hima-dht-game[advisor]",
]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
# Matches the repository's prevailing line width; 88 would rewrap most files.
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.isort]
# Workspace members are first-party; without this ruff sorts them as third-party.
known-first-party = ["hima_dht_cli", "hima_dht_game", "hima_dht_records", "hima_dht_web"]
