# StarCraft II (retail 5.0.16) and the game loop stay on the host: the macOS
# client cannot run in a Linux container, and macOS Docker has no Metal/MPS
# passthrough. Point `hima run` at these services with --port 8090
# --base-url http://localhost:11434/v1 (the defaults).
#
# Default form — stock Ollama, model pulled once per device into a volume:
#   docker compose up -d advisor ollama webui
#   docker compose exec ollama ollama pull qwen3:8b
#
# Baked form — qwen3:8b inside the image, no per-device pull (offline-capable):
#   docker compose --profile baked build leader-baked
#   docker compose --profile baked up -d advisor leader-baked

# Pin the compose project name so every container, network, and volume
# groups under "hima" regardless of the checkout directory name or -p flag
# omission (containers hima-<service>-1, network hima_default).
name: hima

services:
  advisor:
    build:
      context: .
      dockerfile: docker/hima.Dockerfile
      args:
        PACKAGE: hima-dht-game
        EXTRA: advisor
    image: hima-advisor
    command: uvicorn --factory hima_dht_game.advisor:create_default_app --host 0.0.0.0 --port 8090
    environment:
      HF_HOME: /models
    ports:
      # Published ports interpolate from .env (.env.example); the container-
      # internal ports stay fixed so service-name endpoints never change.
      - "${HIMA_ADVISOR_PORT:-8090}:8090"
    volumes:
      - hf-cache:/models
    healthcheck:
      # /health responds only once model loading completes; loading the three
      # advisor models on CPU takes minutes, hence the long start period.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 600s

  webui:
    build:
      context: .
      dockerfile: docker/hima.Dockerfile
      args:
        PACKAGE: hima-dht-web
    image: hima-webui
    command: uvicorn --factory hima_dht_web.server:create_default_app --host 0.0.0.0 --port 8123
    ports:
      - "${HIMA_WEBUI_PORT:-8123}:8123"
    volumes:
      - ./runs:/app/runs:ro
      - ./tmp:/app/tmp:ro

  ollama:
    image: ollama/ollama:0.32.5
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Linux host with NVIDIA GPU: uncomment for GPU inference.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  leader-baked:
    profiles: ["baked"]
    build:
      context: .
      dockerfile: docker/leader.Dockerfile
    ports:
      - "11434:11434"

  # Containerized game (experimental): SC2 4.10 headless under amd64
  # emulation on Apple silicon; results are not comparable with retail
  # 5.0.16 runs. Requires the default ollama form (the leader endpoint is
  # the ollama service name). Build steps: docker/game.Dockerfile header.
  game:
    profiles: ["game"]
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/game.Dockerfile
      args:
        SC2_LICENSE: ${SC2_LICENSE:-}
    image: hima-game
    command: hima run --advisor-host advisor --base-url http://ollama:11434/v1
    volumes:
      - ./runs:/app/runs
      - ./tmp:/app/tmp
    depends_on:
      advisor:
        condition: service_healthy
      ollama:
        condition: service_healthy

volumes:
  hf-cache:
  ollama:
