# Compose side of the three deployment axes (docs/design-deployment.md):
# `hima up --services container` places the managed services here, `hima run
# --game container` runs one game as the `game` job, and the observation
# surface (`hima run --ui`) is independent of both. A host `hima run --game
# host` reaches the published ports with its localhost defaults. The leader
# is an endpoint contract, never a managed service: `hima up` only verifies
# HIMA_LEADER_BASE_URL and never starts an engine at either placement; the
# ollama/leader-baked services below are opt-in profile alternatives
# selected by pointing HIMA_LEADER_BASE_URL at them.
#
# Default set — `hima up --services container` runs the advisor alone and
# records the manifest; `--webui` adds the observation server:
#   docker compose up -d --wait advisor
#   docker compose --profile webui up -d --wait advisor webui
#
# Opt-in profiles:
#   webui  — observation server, added by `hima up --webui`
#   leader — stock Ollama for Linux/NVIDIA hosts; pull the model once into
#            its volume: docker compose exec ollama ollama pull qwen3:8b
#   baked  — qwen3:8b inside the image, no per-device pull (offline-capable):
#            docker compose --profile baked build leader-baked
#            docker compose --profile baked up -d advisor leader-baked
#   game   — containerized SC2 4.10 game job (`hima run --game container`)

# Pin the compose project name so every container, network, and volume
# groups under "hima" regardless of the checkout directory name or -p flag
# omission (containers hima-<service>-1, network hima_default).
name: hima

services:
  advisor:
    build:
      context: .
      dockerfile: docker/hima.Dockerfile
      args:
        PACKAGE: hima-dht-game
        EXTRA: advisor
    image: hima-advisor
    command: uvicorn --factory hima_dht_game.app:create_default_app --host 0.0.0.0 --port 8090
    environment:
      HF_HOME: /models
      # Empty value falls through to the in-code default trio.
      HIMA_ADVISOR_MODELS: ${HIMA_ADVISOR_MODELS:-}
    ports:
      # Published ports interpolate from .env (.env.example); the container-
      # internal ports stay fixed so service-name endpoints never change.
      - "${HIMA_ADVISOR_PORT:-8090}:8090"
    volumes:
      - hf-cache:/models
    healthcheck:
      # /health responds only once model loading completes; loading the three
      # advisor models on CPU takes minutes, hence the long start period.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 600s

  webui:
    # Watching a game is opt-in: a run needs an advisor, never a place to
    # watch it from. `hima up --webui` activates this profile.
    profiles: ["webui"]
    build:
      context: .
      dockerfile: docker/hima.Dockerfile
      args:
        PACKAGE: hima-dht-web
    image: hima-webui
    command: uvicorn --factory hima_dht_web.server:create_default_app --host 0.0.0.0 --port 8123
    ports:
      - "${HIMA_WEBUI_PORT:-8123}:8123"
    volumes:
      - ./runs:/app/runs:ro
      - ./tmp:/app/tmp:ro

  ollama:
    # Opt-in containerized leader engine for Linux/NVIDIA hosts; `hima`
    # never manages it — activate the profile and point HIMA_LEADER_BASE_URL
    # at the published port (compose-network game: http://ollama:11434/v1).
    profiles: ["leader"]
    image: ollama/ollama:0.32.5
    # Published so the host reaches the containerized engine. A native
    # A host `ollama serve` already holding the port fails this publish with
    # an explicit bind error — move HIMA_OLLAMA_PORT to run both side by side.
    ports:
      - "${HIMA_OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Linux host with NVIDIA GPU: uncomment for GPU inference.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  leader-baked:
    profiles: ["baked"]
    build:
      context: .
      dockerfile: docker/leader.Dockerfile
    ports:
      - "11434:11434"

  # Containerized game (experimental): SC2 4.10 headless; only the SC2
  # binary runs under amd64 emulation (qemu-user) on non-x86_64 hosts.
  # Results are not comparable with retail 5.0.16 runs. Configuration flows
  # through the HIMA_* environment, never command flags: the block below
  # sets container-context defaults and forwards .env overrides, keeping
  # the CLI precedence chain (flag > environment > .env > default) intact.
  # Build steps: docker/game.Dockerfile header.
  game:
    profiles: ["game"]
    build:
      context: .
      dockerfile: docker/game.Dockerfile
      args:
        SC2_LICENSE: ${SC2_LICENSE:-}
    image: hima-game
    command: hima run
    environment:
      # Default for a hand-run compose job, where the advisor is a compose
      # service; the localhost default would point at the game container
      # itself. `hima run` overrides it per invocation with the address the
      # manifest's advisor actually answers on.
      HIMA_ADVISOR_HOST: advisor
      # Inside the container the game is already local. Without this pin the
      # shipped default (`container`) would make the in-container `hima run`
      # dispatch back into compose.
      HIMA_GAME: host
      # Leader default: the host's native Ollama through the container-to-
      # host name. A .env value (remote endpoint, or http://ollama:11434/v1
      # for the compose service) overrides via interpolation.
      HIMA_LEADER_BASE_URL: ${HIMA_LEADER_BASE_URL:-http://host.docker.internal:11434/v1}
      HIMA_LEADER_MODEL: ${HIMA_LEADER_MODEL:-qwen3:8b}
      HIMA_LEADER_API_KEY: ${HIMA_LEADER_API_KEY:-ollama}
      HIMA_LOG_LEVEL: ${HIMA_LOG_LEVEL:-INFO}
    volumes:
      - ./runs:/app/runs
      - ./tmp:/app/tmp
    # No depends_on: hima is the orchestrator and prechecks the advisor at
    # its recorded endpoint, which may be a host process rather than the
    # compose service.

volumes:
  hf-cache:
  ollama:
